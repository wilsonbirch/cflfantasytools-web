version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 10
      groups:
          # Coupled stacks come FIRST — a group earlier in this list wins the
          # package, and minor-and-patch below would otherwise claim their
          # minor/patch bumps and split the stack across PRs.
          #
          # Each sets update-types explicitly: dependabot defaults a group to
          # [minor, patch], which lets a solo major escape and land a
          # half-upgraded stack.
          react:
              patterns:
                  - 'react'
                  - 'react-dom'
                  - '@types/react'
                  - '@types/react-dom'
              update-types:
                  - 'major'
                  - 'minor'
                  - 'patch'
          # The framework packages share a version line — @react-router/dev
          # generates types the router runtime has to match, and
          # @react-router/node and /serve ship as one release.
          react-router:
              patterns:
                  - 'react-router'
                  - '@react-router/*'
              update-types:
                  - 'major'
                  - 'minor'
                  - 'patch'
          # The codegen CLI and the preset emit and consume the same artifacts;
          # graphql-request is the client those artifacts are typed against.
          # A partial bump regenerates code the others cannot read.
          graphql:
              patterns:
                  - 'graphql'
                  - 'graphql-request'
                  - '@graphql-codegen/*'
              update-types:
                  - 'major'
                  - 'minor'
                  - 'patch'
          vitest:
              patterns:
                  - 'vitest'
                  - '@vitest/*'
                  - 'vitest-mock-extended'
              update-types:
                  - 'major'
                  - 'minor'
                  - 'patch'
          # tailwindcss and its vite plugin are one release train since v4
          # moved the engine into the plugin.
          tailwind:
              patterns:
                  - 'tailwindcss'
                  - '@tailwindcss/*'
              update-types:
                  - 'major'
                  - 'minor'
                  - 'patch'
          # patterns: ['*'] is load-bearing. Dependabot scores a group with NO
          # patterns at 500 for every package, above a '@scope/*' wildcard (~100),
          # so without it this group pulled @vitest/coverage-v8, @react-router/*,
          # @pothos/* etc. out of their coupled groups, majors included (job log
          # 2026-11-10: "Skipping @vitest/coverage-v8 for group 'vitest' - belongs
          # to more specific group 'minor-and-patch'"). A bare '*' scores 1, so
          # every coupled group above wins. Source: dependabot-core
          # updater/lib/dependabot/updater/pattern_specificity_calculator.rb.
          minor-and-patch:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'
          # Advisory-driven PRs bypass every version-update group above unless
          # a group opts in with applies-to. Without this, one advisory wave
          # arrives as N solo PRs, each needing its own branch update and CI run.
          security:
              applies-to: security-updates
              patterns:
                  - '*'
      # Each ignore below is a major that cannot install today because a
      # dependency's peer range excludes it — the PR fails `npm ci` with
      # ERESOLVE and nothing short of overrides gets it through. Each names
      # what unblocks it; delete the entry once that ships. Majors are NOT
      # blocked wholesale, as the API config does: this repo is still on
      # typescript 5.x while the API runs 6.x, so the next major there is one
      # we want.
      ignore:
          # eslint 10 (#32, checked 2026-11-10): eslint-plugin-import 2.32.0,
          # eslint-plugin-react 7.37.5 and eslint-plugin-jsx-a11y 6.10.2 all
          # peer on eslint <=9, and eslint-plugin-react crashes under 10.
          # Unblocks when all three release eslint 10 support
          # (import-js/eslint-plugin-import#3278,
          # jsx-eslint/eslint-plugin-react#3977,
          # jsx-eslint/eslint-plugin-jsx-a11y#1075). @eslint/js 10 peers on
          # eslint 10, so it is held with it.
          - dependency-name: 'eslint'
            update-types: ['version-update:semver-major']
          - dependency-name: '@eslint/js'
            update-types: ['version-update:semver-major']
          # graphql 17 (#28, checked 2026-11-10): the codegen packages accept
          # it; graphql-request 7.4.0 peers on graphql 14 - 16. Unblocks when
          # graffle-js/graffle#1499 is released, or if gql.server.ts drops
          # graphql-request for a fetch wrapper. Only graphql's own major is
          # held — codegen and graphql-request majors still arrive.
          - dependency-name: 'graphql'
            update-types: ['version-update:semver-major']
      #
      # typescript 7 IS known-blocked: it is the native compiler rewrite and
      # typescript-eslint hard-caps its peer range below it, so `npm ci`
      # ERESOLVEs rather than merely warning. Add this entry to the ignore
      # list above once this repo reaches 6.x, rather than now — today it
      # would also hold back 6.x:
      #
      #     - dependency-name: 'typescript'
      #       update-types: ['version-update:semver-major']
      #
      # Until then a typescript 7 PR will simply fail CI at install, which is
      # informative rather than harmful.

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 5
      groups:
          # One group across every update-type, majors included. checkout and
          # setup-node sit on ADJACENT lines in all four jobs, so two solo
          # major PRs conflict textually in every one of them — proven when
          # #4 and #5 arrived separately and the second would not rebase.
          # `@dependabot recreate` is the only way out, per PR. The npm
          # argument for solo majors (a risky bump deserves its own review)
          # does not transfer: these are first-party GitHub actions whose
          # diffs are one `uses:` line each.
          actions:
              patterns:
                  - '*'
              update-types:
                  - 'major'
                  - 'minor'
                  - 'patch'
          security:
              applies-to: security-updates
              patterns:
                  - '*'
